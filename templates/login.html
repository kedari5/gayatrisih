{% extends "base.html" %}

{% block title %}Return to the Fields - Krishi Sakhi{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-16rem)] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md animate-fade-in">
        <!-- Brand / Identity -->
        <div class="text-center mb-10">
            <div class="w-20 h-20 bg-gradient-to-br from-forest to-moss rounded-3xl flex items-center justify-center shadow-xl mx-auto mb-6 transform rotate-6">
                <i class="fas fa-leaf text-cream text-3xl"></i>
            </div>
            <h1 class="font-serif text-4xl text-forest" data-translate="login">Welcome Back</h1>
            <p class="text-forest/60 mt-2">{{ gettext('Continue your journey in nourishing the world.') }}</p>
        </div>

        <!-- Login Card -->
        <div class="glass-card p-10 rounded-[40px] border-white/60 shadow-2xl relative overflow-hidden">
            <!-- Pattern Decor -->
            <div class="absolute -right-10 -bottom-10 opacity-[0.03] pointer-events-none">
                <i class="fas fa-wheat-awn text-[12rem]"></i>
            </div>

            <form method="POST" class="space-y-6 relative z-10">

                <div class="space-y-2">
                    <label for="password" class="text-xs font-bold text-forest/40 uppercase tracking-widest px-2" data-translate="password">Password</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-5 top-1/2 -translate-y-1/2 text-forest/30"></i>
                        <input type="password" id="password" name="password" required 
                               class="w-full pl-12 pr-6 py-4 bg-white/50 border border-forest/10 rounded-2xl focus:ring-4 focus:ring-forest/5 focus:border-forest outline-none transition-all"
                               placeholder="Enter your password" data-translate="passwordPlaceholder">
                    </div>
                </div>
                
                <div class="pt-4">
                    <button type="submit" class="w-full py-5 bg-forest text-cream font-bold rounded-2xl hover:bg-moss transition-all shadow-xl shadow-forest/20 transform active:scale-95 group">
                        <span data-translate="loginButton">Access Dashboard</span>
                        <i class="fas fa-arrow-right ms-2 group-hover:translate-x-1 transition-transform"></i>
                    </button>
                </div>
            </form>
            
            <div class="text-center mt-8 pt-8 border-t border-forest/5">
                <p class="text-sm text-forest/60" data-translate="noAccount">
                    Don't have an account? 
                    <a href="{{ url_for('signup') }}" class="text-forest font-bold hover:underline" data-translate="signupLink">Signup</a>
                </p>
            </div>
        </div>
    </div>
</div>

<style>
    .animate-fade-in { animation: fadeIn 0.8s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
</style>

{% endblock %}

{% block scripts %}
<script>
    const loginTranslations = {
        en: {
            login: "Welcome Back",
            loginButton: "Access Dashboard",
            signupLink: "Signup"
        },
        ml: {
            login: "സ്വാഗതം",
            loginButton: "പ്രവേശിക്കുക",
            signupLink: "ഇവിടെ ചേരുക"
        },
        hi: {
            login: "आपका स्वागत है",
            loginButton: "डैशबोर्ड में प्रवेश करें",
            signupLink: "हमारे साथ जुड़ें"
        },
        ta: {
            login: "மீண்டும் வருக",
            loginButton: "டாஷ்போர்டை அணுகவும்",
            signupLink: "எங்கள் சமூகத்தில் சேருங்கள்"
        },
        te: {
            login: "మళ్ళీ స్వాగతం",
            loginButton: "డాష్‌బోర్డ్ ప్రవేశం",
            signupLink: "మాతో చేరండి"
        }
    };

    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
            if (typeof translations !== 'undefined') {
                for (const lang in loginTranslations) {
                    if (translations[lang]) {
                        translations[lang] = {...translations[lang], ...loginTranslations[lang]};
                    } else {
                        translations[lang] = loginTranslations[lang];
                    }
                }
                if (typeof currentLanguage !== 'undefined') {
                    document.querySelectorAll('[data-translate]').forEach(function(element) {
                        const key = element.getAttribute('data-translate');
                        if (translations[currentLanguage] && translations[currentLanguage][key]) {
                            if (element.tagName === 'INPUT') {
                                element.placeholder = translations[currentLanguage][key];
                            } else {
                                element.textContent = translations[currentLanguage][key];
                            }
                        }
                    });
                }
            }
        }, 100);
    });
</script>
{% endblock %}
