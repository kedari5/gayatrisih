{% extends "base.html" %}

{% block title %}Chat Assistant - Krishi Sakhi{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-10 mx-auto">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h5><i class="fas fa-robot me-2"></i><span data-translate="chatWithAI">Chat with Krishi Sakhi AI</span></h5>
            </div>
            <div class="card-body">
                <div id="chat-messages" style="height: 400px; overflow-y: auto; border: 1px solid #dee2e6; padding: 15px; border-radius: 5px;">
                    {% for chat in chat_history %}
                    <div class="mb-3">
                        <div class="d-flex justify-content-end mb-2">
                            <div class="bg-primary text-white p-2 rounded" style="max-width: 70%;">
                                {{ chat.message }}
                            </div>
                        </div>
                        {% if chat.response %}
                        <div class="d-flex justify-content-start">
                            <div class="bg-light border p-2 rounded" style="max-width: 70%;">
                                {{ chat.response }}
                            </div>
                        </div>
                        {% endif %}
                    </div>
                    {% endfor %}
                </div>
                
                <div class="mt-3">
                    <div class="input-group">
                        <input type="text" id="message-input" class="form-control" 
                               placeholder="Ask about farming, weather, crops..." 
                               data-translate="messagePlaceholder">
                        <button class="btn btn-success" onclick="sendMessage()">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                        <button class="btn btn-info" onclick="startVoiceRecognition()">
                            <i class="fas fa-microphone"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
async function sendMessage() {
    const input = document.getElementById('message-input');
    const message = input.value.trim();
    if (!message) return;
    
    // Add user message to chat
    addMessageToChat(message, 'user');
    input.value = '';
    
    try {
        const response = await fetch('/send_message', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({message: message})
        });
        
        const data = await response.json();
        addMessageToChat(data.response, 'bot');
    } catch (error) {
        addMessageToChat(getTranslation('errorMessage'), 'bot');
    }
}

function addMessageToChat(message, sender) {
    const chatContainer = document.getElementById('chat-messages');
    const messageDiv = document.createElement('div');
    messageDiv.className = 'mb-3';
    
    if (sender === 'user') {
        messageDiv.innerHTML = `
            <div class="d-flex justify-content-end">
                <div class="bg-primary text-white p-2 rounded" style="max-width: 70%;">
                    ${message}
                </div>
            </div>
        `;
    } else {
        messageDiv.innerHTML = `
            <div class="d-flex justify-content-start">
                <div class="bg-light border p-2 rounded" style="max-width: 70%;">
                    ${message}
                </div>
            </div>
        `;
    }
    
    chatContainer.appendChild(messageDiv);
    chatContainer.scrollTop = chatContainer.scrollHeight;
}

function startVoiceRecognition() {
    if (!('webkitSpeechRecognition' in window)) {
        alert(getTranslation('voiceNotSupported'));
        return;
    }
    
    const recognition = new webkitSpeechRecognition();
    recognition.lang = getSpeechRecognitionLanguage();
    recognition.continuous = false;
    recognition.interimResults = false;
    
    recognition.onstart = function() {
        document.getElementById('message-input').placeholder = getTranslation('listening');
    };
    
    recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        document.getElementById('message-input').value = transcript;
        document.getElementById('message-input').placeholder = getTranslation('messagePlaceholder');
    };
    
    recognition.onerror = function(event) {
        console.error('Speech recognition error', event.error);
        document.getElementById('message-input').placeholder = getTranslation('voiceError');
    };
    
    recognition.onend = function() {
        document.getElementById('message-input').placeholder = getTranslation('messagePlaceholder');
    };
    
    recognition.start();
}

function getSpeechRecognitionLanguage() {
    const langMap = {
        'en': 'en-US',
        'ml': 'ml-IN',
        'hi': 'hi-IN',
        'ta': 'ta-IN',
        'te': 'te-IN'
    };
    return langMap[currentLanguage] || 'en-US';
}

function getTranslation(key) {
    if (translations && translations[currentLanguage] && translations[currentLanguage][key]) {
        return translations[currentLanguage][key];
    }
    // Fallback to English
    const englishTranslations = {
        'errorMessage': 'Sorry, I encountered an error. Please try again.',
        'voiceNotSupported': 'Voice input is not supported in your browser.',
        'listening': 'Listening...',
        'voiceError': 'Voice input failed. Please try again.'
    };
    return englishTranslations[key] || key;
}

document.getElementById('message-input').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        sendMessage();
    }
});

// Merge chat translations with base translations
document.addEventListener('DOMContentLoaded', function() {
    // Wait for base translations to load
    setTimeout(function() {
        if (typeof translations !== 'undefined') {
            // Merge translations
            for (const lang in chatTranslations) {
                if (translations[lang]) {
                    translations[lang] = {...translations[lang], ...chatTranslations[lang]};
                } else {
                    translations[lang] = chatTranslations[lang];
                }
            }
            
            // Apply translations if language is already set
            if (typeof currentLanguage !== 'undefined') {
                document.querySelectorAll('[data-translate]').forEach(function(element) {
                    const key = element.getAttribute('data-translate');
                    if (translations[currentLanguage] && translations[currentLanguage][key]) {
                        if (element.tagName === 'INPUT') {
                            element.placeholder = translations[currentLanguage][key];
                        } else {
                            element.textContent = translations[currentLanguage][key];
                        }
                    }
                });
            }
        }
    }, 100);
});
</script>
{% endblock %}
