{% extends "base.html" %}

{% block title %}System Error - Krishi Sakhi{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-16rem)] flex items-center justify-center px-4">
    <div class="text-center animate-fade-in group">
        <div class="relative mb-8 inline-block">
            <div class="w-32 h-32 bg-red-500/5 rounded-[40px] flex items-center justify-center transform group-hover:rotate-12 transition-transform">
                <i class="fas fa-exclamation-triangle text-red-500/20 text-6xl"></i>
            </div>
            <div class="absolute -top-2 -right-2 w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-lg border-2 border-red-500/10">
                <span class="font-serif text-xl text-red-500">500</span>
            </div>
        </div>
        
        <h1 class="font-serif text-4xl text-forest mb-4">A Hiccup in the Harvest</h1>
        <p class="text-forest/60 max-w-md mx-auto mb-10">
            Internal server error. We're looking into it. Please try again in a few moments.
        </p>
        
        <a href="{{ url_for('dashboard') }}" class="inline-flex items-center space-x-2 px-8 py-4 bg-forest text-cream rounded-2xl hover:bg-moss transition-all shadow-xl shadow-forest/20 transform active:scale-95">
            <i class="fas fa-redo"></i>
            <span>Refresh Dashboard</span>
        </a>
    </div>
</div>

<style>
    .animate-fade-in { animation: fadeIn 0.8s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
</style>
{% endblock %}
